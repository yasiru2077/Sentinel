services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/sentinel_db
      - DB_USER=root
      - DB_PASSWORD=gorillacat
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: gorillacat
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: